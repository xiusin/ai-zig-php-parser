name: Performance Regression Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PERF_BASELINE_DIR: .perf_baselines
  PERF_THRESHOLD: "5.0"
  PERF_FAIL_ON_REGRESSION: "true"

jobs:
  performance-check:
    name: Performance Regression Detection
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        zig-version: ['0.11.0']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取完整历史以便访问基线
      
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}
      
      - name: Cache Zig dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      
      - name: Restore performance baselines
        uses: actions/cache@v3
        with:
          path: ${{ env.PERF_BASELINE_DIR }}
          key: perf-baselines-${{ github.ref_name }}
          restore-keys: |
            perf-baselines-main
            perf-baselines-master
      
      - name: Build project
        run: zig build -Doptimize=ReleaseFast

      - name: Setup Python venv (Milestone1)
        run: |
          python3 -m venv .venv-m1
          source .venv-m1/bin/activate
          python3 -m pip install -r ci/requirements.txt

      - name: Generate Milestone1 matrices
        run: |
          source .venv-m1/bin/activate
          python3 tools/gen_diff_matrix.py --out-dir artifacts
          python3 tools/gen_callchain_matrix.py --out docs/milestone1/callchain_matrix.md

      - name: Run Milestone1 perf baseline (pytest + perf stat)
        run: |
          source .venv-m1/bin/activate
          python3 ci/scripts/run_perf_baseline.py \
            --cases examples/tests/basic/test_basic_features.php,examples/tests/arrays/test_arrays_0.php \
            --modes tree,bytecode,fast \
            --out .perf_reports/milestone1_baseline.json \
            --benchmark-json .perf_reports/pytest_benchmark.json
      
      - name: Run performance benchmarks
        run: zig build bench-all
        continue-on-error: true
      
      - name: Run regression detection
        id: regression-check
        run: |
          zig build perf-check
          echo "status=$?" >> $GITHUB_OUTPUT
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
      
      - name: Upload performance report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-report-${{ github.sha }}
          path: |
            .perf_reports/
            artifacts/
            docs/milestone1/
          retention-days: 30
      
      - name: Save performance baselines
        uses: actions/cache/save@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          path: ${{ env.PERF_BASELINE_DIR }}
          key: perf-baselines-${{ github.ref_name }}-${{ github.sha }}
      
      - name: Comment PR with results
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const reportFiles = fs.readdirSync('.perf_reports');
            if (reportFiles.length > 0) {
              const latestReport = reportFiles.sort().reverse()[0];
              const reportContent = fs.readFileSync(`.perf_reports/${latestReport}`, 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reportContent
              });
            }
      
      - name: Fail if regression detected
        if: steps.regression-check.outputs.status != '0' && env.PERF_FAIL_ON_REGRESSION == 'true'
        run: |
          echo "Performance regression detected!"
          exit 1
      
      - name: Generate performance badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          # 生成性能徽章数据
          echo "Generating performance badge..."
          # 这里可以集成 shields.io 或其他徽章服务

  performance-comparison:
    name: Compare with baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
      
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.11.0'
      
      - name: Run PR benchmarks
        run: |
          zig build -Doptimize=ReleaseFast
          zig build bench-all
          cp -r .perf_reports pr_reports
      
      - name: Checkout base branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }}
      
      - name: Run base benchmarks
        run: |
          zig build -Doptimize=ReleaseFast
          zig build bench-all
          cp -r .perf_reports base_reports
      
      - name: Compare results
        run: |
          echo "Comparing PR vs base branch performance..."
          # 这里可以添加自定义比较脚本
      
      - name: Upload comparison report
        uses: actions/upload-artifact@v3
        with:
          name: performance-comparison-${{ github.event.pull_request.number }}
          path: |
            pr_reports/
            base_reports/
          retention-days: 30
