name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig-version: ['0.13.0', '0.14.0', '0.15.0']
        include:
          # Test with latest stable on all platforms
          - os: ubuntu-latest
            zig-version: '0.15.2'
          - os: macos-latest
            zig-version: '0.15.2'
          - os: windows-latest
            zig-version: '0.15.2'
        exclude:
          # Exclude older versions on Windows for faster CI
          - os: windows-latest
            zig-version: '0.13.0'
          - os: windows-latest
            zig-version: '0.14.0'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v3
      with:
        version: ${{ matrix.zig-version }}

    - name: Verify Zig installation
      run: zig version

    - name: Cache Zig build
      uses: actions/cache@v4
      with:
        path: |
          .zig-cache
          zig-out
        key: ${{ runner.os }}-zig-${{ matrix.zig-version }}-${{ hashFiles('**/build.zig.zon') }}
        restore-keys: |
          ${{ runner.os }}-zig-${{ matrix.zig-version }}-
          ${{ runner.os }}-zig-

    - name: Check code formatting
      run: zig fmt --check .

    - name: Build (Debug)
      run: zig build

    - name: Build (ReleaseSafe)
      run: zig build -Doptimize=ReleaseSafe

    - name: Build (ReleaseFast)
      run: zig build -Doptimize=ReleaseFast

    - name: Run tests
      run: zig build test

    - name: Test basic functionality
      run: |
        echo '<?php echo "Hello World!"; ?>' > test.php
        ./zig-out/bin/php-interpreter test.php

    - name: Test examples (Linux/macOS only)
      if: runner.os != 'Windows'
      run: |
        # Create examples directory if it doesn't exist
        mkdir -p examples
        # Create a simple test example
        echo '<?php
        $a = 42;
        $b = "Hello";
        echo $a . " " . $b . "\n";
        ?>' > examples/test_example.php
        # Test the example
        timeout 10s ./zig-out/bin/php-interpreter examples/test_example.php || echo "Example test completed"

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v3
      with:
        version: '0.15.2'

    - name: Cache Zig build
      uses: actions/cache@v4
      with:
        path: |
          .zig-cache
          zig-out
        key: ubuntu-latest-zig-0.15.2-${{ hashFiles('**/build.zig.zon') }}

    - name: Build for benchmarking
      run: zig build -Doptimize=ReleaseFast

    - name: Setup benchmark scripts
      run: |
        mkdir -p scripts bench_results examples
        # Create benchmark script if it doesn't exist
        if [ ! -f "scripts/benchmark.sh" ]; then
          make create-bench-script
        fi

    - name: Create benchmark examples
      run: |
        # Fibonacci example
        cat > examples/fibonacci.php << 'EOF'
        <?php
        function fibonacci($n) {
            if ($n <= 1) return $n;
            return fibonacci($n - 1) + fibonacci($n - 2);
        }

        $result = fibonacci(25);
        echo "Fibonacci(25) = $result\n";
        ?>
        EOF

        # Prime number example
        cat > examples/prime.php << 'EOF'
        <?php
        function is_prime($n) {
            if ($n <= 1) return false;
            if ($n <= 3) return true;
            if ($n % 2 == 0 || $n % 3 == 0) return false;
            for ($i = 5; $i * $i <= $n; $i += 6) {
                if ($n % $i == 0 || $n % ($i + 2) == 0) return false;
            }
            return true;
        }

        $count = 0;
        for ($i = 2; $i < 1000; $i++) {
            if (is_prime($i)) $count++;
        }
        echo "Primes found: $count\n";
        ?>
        EOF

        # Array operations example
        cat > examples/array_operations.php << 'EOF'
        <?php
        $arr = [];
        for ($i = 0; $i < 10000; $i++) {
            $arr[] = $i * 2;
        }

        $sum = 0;
        foreach ($arr as $val) {
            $sum += $val;
        }

        echo "Array sum: $sum\n";
        ?>
        EOF

    - name: Run benchmarks
      run: |
        chmod +x scripts/benchmark.sh
        ./scripts/benchmark.sh --compare

    - name: Generate benchmark table
      run: |
        ./scripts/benchmark.sh --table > bench_results/benchmark_table.md

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.run_number }}
        path: bench_results/

    - name: Comment benchmark results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const tablePath = 'bench_results/benchmark_table.md';

          if (fs.existsSync(tablePath)) {
            const table = fs.readFileSync(tablePath, 'utf8');
            const body = `## 📊 Benchmark Results

${table}

*Benchmark run completed in ${{ github.run_number }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, benchmark]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v3
      with:
        version: '0.15.2'

    - name: Get version
      id: version
      run: |
        # Try to get version from git tags
        VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Build release binaries
      run: |
        # Build for multiple platforms
        make build-fast

        # Create release directory
        mkdir -p release

        # Copy binaries with platform names
        cp zig-out/bin/php-interpreter release/php-interpreter-linux-x64

    - name: Create release archive
      run: |
        cd release
        tar -czf ../zig-php-parser-${{ steps.version.outputs.version }}-linux-x64.tar.gz *
        cd ..

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## Changes

          This is an automated release of Zig-PHP-Parser.

          ### Build Information
          - Built with Zig 0.15.2
          - Optimized for performance (ReleaseFast)
          - Target: Linux x64

          ### Assets
          - `zig-php-parser-${{ steps.version.outputs.version }}-linux-x64.tar.gz` - Linux x64 binary
        files: |
          zig-php-parser-${{ steps.version.outputs.version }}-linux-x64.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
